[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperplan"
version = "0.1.0"
description = "Deterministic timber sleeper bed workshop planning: geometry, cutting, fixings, costs and drawings."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jake"}]
dependencies = []

[project.optional-dependencies]
pdf = ["reportlab>=4,<5"]

[project.scripts]
sleeperplan = "sleeperplan.cli:main"

[tool.setuptools.packages.find]
include = ["sleeperplan*"]
