<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1100" height="6" fill="#147c80" stroke="#147c80" stroke-width="1"/>
<text x="30" y="43" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#183339" text-anchor="start">Workshop process / script-driven sequence</text>
<text x="30" y="69" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#52666a" text-anchor="start">DRAFT_MARK_OUT_ONLY  |  Follow these steps with BUILD.md, cuts.csv and fixings.csv</text>
<rect x="38" y="92" width="1024" height="72" fill="#edf3f1" stroke="#d3e0dc" stroke-width="1"/>
<text x="54" y="128" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#183339" text-anchor="start">1. Receive and inspect timber stock; reject twisted/split members.</text>
<rect x="38" y="186" width="1024" height="72" fill="#edf3f1" stroke="#d3e0dc" stroke-width="1"/>
<text x="54" y="222" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#183339" text-anchor="start">2. Label each stock board Bxx and mark datum A before any cut.</text>
<rect x="38" y="280" width="1024" height="72" fill="#edf3f1" stroke="#d3e0dc" stroke-width="1"/>
<text x="54" y="316" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#183339" text-anchor="start">3. Execute cuts.csv in sequence; kerf_start..kerf_end is waste band.</text>
<rect x="38" y="374" width="1024" height="72" fill="#edf3f1" stroke="#d3e0dc" stroke-width="1"/>
<text x="54" y="410" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#183339" text-anchor="start">4. Re-label produced parts and preserve A / TOP / OUTER orientation.</text>
<rect x="38" y="468" width="1024" height="72" fill="#edf3f1" stroke="#d3e0dc" stroke-width="1"/>
<text x="54" y="504" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#183339" text-anchor="start">5. Drill and drive by piece fixing sheets (exact U, V, W coordinates).</text>
<rect x="38" y="562" width="1024" height="72" fill="#edf3f1" stroke="#d3e0dc" stroke-width="1"/>
<text x="54" y="598" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#183339" text-anchor="start">6. Assemble course-by-course using per-course plan sheets.</text>
<rect x="38" y="612" width="496" height="88" fill="#ecf6ef" stroke="#b8d6c0" stroke-width="1"/>
<text x="56" y="640" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1f5e2f" text-anchor="start">CORRECT</text>
<line x1="56" y1="653" x2="68" y2="665" stroke="#1f5e2f" stroke-width="3"/>
<line x1="68" y1="665" x2="90" y2="635" stroke="#1f5e2f" stroke-width="3"/>
<text x="98" y="663" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52666a" text-anchor="start">Check entry face, direction arrow and quantity before each action.</text>
<rect x="566" y="612" width="496" height="88" fill="#fff0e7" stroke="#ebc5ad" stroke-width="1"/>
<text x="584" y="640" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#9d4e19" text-anchor="start">INCORRECT</text>
<line x1="584" y1="634" x2="612" y2="666" stroke="#9d4e19" stroke-width="3"/>
<line x1="612" y1="634" x2="584" y2="666" stroke="#9d4e19" stroke-width="3"/>
<text x="622" y="663" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52666a" text-anchor="start">Never drill or drive when pilot_mode is UNCONFIRMED.</text>
<text x="42" y="709" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52666a" text-anchor="start">All positions, lengths and hardware IDs are generated from plan geometry; do not freehand from screenshots.</text>
</svg>
